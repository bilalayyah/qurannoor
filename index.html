<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="description"
      content="QuranNoor.com — Read, listen to, and reflect upon the Noble Quran with authentic Uthmani and IndoPak Arabic script, recognized English translations, and curated recitations."
    />

    <meta name="theme-color" content="#0E6B4B" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QuranNoor" />
    <meta property="og:title" content="QuranNoor – Read. Listen. Reflect." />
    <meta
      property="og:description"
      content="Read, listen to, and reflect upon the Noble Quran with authentic Uthmani Arabic script, recognized English translations, and curated recitations."
    />
    <meta property="og:url" content="https://qurannoor.com/" />
    <link rel="canonical" href="https://qurannoor.com/" />
    <meta property="og:image" content="https://qurannoor.com/icons/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="QuranNoor – Read. Listen. Reflect." />
    <meta
      name="twitter:description"
      content="Read, listen to, and reflect upon the Noble Quran on QuranNoor.com."
    />
    <meta name="twitter:image" content="https://qurannoor.com/icons/icon-512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://verses.quran.foundation" crossorigin />
    <!-- Preload the UI font (Plus Jakarta Sans variable font, latin) so first paint already uses it: avoids the font-swap reflow that caused the footer CLS (desktop 0.447 in PageSpeed, 2026-11-18) -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="https://fonts.gstatic.com/s/plusjakartasans/v12/LDIoaomQNQcsA88c7O9yZ4KMCoOg4Ko20yw.woff2"
    />
    <!-- Preload the Quran font (UthmanicHafs) so it is ready before first paint whenever the connection allows: with font-display: optional it is then used immediately; otherwise the fallback renders with no swap and no layout shift (H-1, iteration 5). -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="https://verses.quran.foundation/fonts/quran/hafs/uthmanic_hafs/UthmanicHafs1Ver18.woff2"
    />
    <!-- Preload the translation fonts (Source Serif 4 latin + Noto Nastaliq Urdu arabic, the variable-font files that cover all used weights) so they are ready before first paint whenever the connection allows: with font-display: optional they are then used immediately; otherwise the fallback renders with no swap and no layout shift (H-1, iteration 6 — the same treatment iteration 5 applied to UthmanicHafs; the late swap of these two fonts was the remaining ayah mobile CLS ~0.15–0.18). -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="https://fonts.gstatic.com/s/sourceserif4/v15/vEFI2_tTDB4M7-auWDN0ahZJW1gb8tc.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="https://fonts.gstatic.com/s/notonastaliqurdu/v23/LhW4MUPbN-oZdNFcBy1-DJYsEoTq5pu3SvoMC9Y.woff2"
    />
    <!-- Preload the EXTENDED subsets too (iteration 6, probe run 1): the cold-load diagnostic (qn-iter6-font-timing.mjs) proved the remaining 0.15–0.18 shift is NOT the latin/arabic files above — they arrive before first paint — but four files the browser only discovers at first layout, finishing ~1450–1510 ms, just after first paint (1352 ms), and swapping in: Source Serif 4 latin-ext (the translation's macrons ā ī ū and ʿ/ʾ live there), Noto Nastaliq Urdu latin (Latin digits/punctuation inside the Urdu block), and Scheherazade New arabic + latin (per-glyph fallback for the Quran/tafsir Arabic). Preloading them the same way makes them arrive before first paint, so nothing swaps after it. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="https://fonts.gstatic.com/s/sourceserif4/v15/vEFI2_tTDB4M7-auWDN0ahZJW1gV8tenXg.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="https://fonts.gstatic.com/s/notonastaliqurdu/v23/LhW4MUPbN-oZdNFcBy1-DJYsEoTq5pu3T_oM.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="https://fonts.gstatic.com/s/scheherazadenew/v21/4UaZrFhTvxVnHDvUkUiHg8jprP4DOwFmO24p.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="https://fonts.gstatic.com/s/scheherazadenew/v21/4UaZrFhTvxVnHDvUkUiHg8jprP4DOwRmOw.woff2"
    />
    <!-- Plus Jakarta Sans (UI font) loads with display=swap — its file is preloaded and the UI text is fixed-height, so a late arrival does not shift layout (home/surah/prayer CLS ≤ 0.019). It gets its own link because Scheherazade New below needs display=optional (H-1, iteration 7). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <!-- Scheherazade New loads with display=optional, NOT swap (H-1, iteration 7): it is the per-glyph fallback in the Quran/tafsir Arabic stack ('UthmanicHafs', 'Scheherazade New', serif — src/index.css), so any glyph UthmanicHafs lacks renders in it; the cold-load diagnostic (qn-iter7-font-timing.mjs) proved its files are the LAST to arrive (~2.8–3.1 s through the relay, after a ~1.35 s first paint), and a display=swap arrival that late swaps those glyphs' metrics — the residual ayah #text shift ~0.15 at ~2.4–2.9 s on 2:255/2:286-mobile. With optional, a late arrival never swaps: slow first visits render the serif fallback for the uncovered glyphs (correct text, presentation only); fast/cached visits render Scheherazade as before. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;500;600;700&display=optional"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <!-- Source Serif 4 (English translation font) loads with display=optional, NOT swap: the css2 display param applies to every family in the request, so it gets its own link (H-1, iteration 6). On a slow first visit the translation renders in the Georgia fallback (correct text, different style — presentation only); on fast/cached visits it renders in Source Serif 4 as before. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=optional"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Lateef:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <!-- Noto Nastaliq Urdu (Urdu translation font) loads with display=optional, NOT swap — same reason as Source Serif 4 above (H-1, iteration 6). Slow first visit: fallback serif renders (correct text, different style); fast/cached: Nastaliq as before. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=optional"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <script type="application/ld+json">

        "@context": "https://schema.org",

        "description": "Read, listen to, and reflect upon the Noble Quran with authentic Uthmani Arabic script, recognized English translations, and high-quality recitations."
